[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-community-bot"
version = "2.0.0"
description = "A production-ready, modular Telegram community & moderation bot built on Telethon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kiarash707" }]
keywords = ["telegram", "telethon", "bot", "moderation", "anti-spam", "asyncio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]

dependencies = [
  "telethon>=1.34,<2",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
fast = ["cryptg>=0.4"]
uvloop = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
bot = "bot.cli:main"

[project.urls]
Homepage = "https://github.com/kiarash707/reporter"
Documentation = "https://github.com/kiarash707/reporter/tree/main/docs"
Source = "https://github.com/kiarash707/reporter"

[tool.setuptools]
packages = ["bot", "bot.handlers", "bot.i18n", "bot.keyboards", "bot.services", "bot.storage", "bot.utils"]

[tool.setuptools.package-data]
"bot.i18n" = ["locales/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bot"]
omit = ["bot/cli.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
